name: Inno plugin

# Builds the 7-Zip Inno Setup plugin in InnoPlugin/ and runs its tests (see
# InnoPlugin/tests/README.md). The jobs run in parallel where they can:
#   corpus   test installers compiled with Inno Setup under Wine; restored from
#            the cache, so only missing or outdated installers are compiled
#   build    GCC, MinGW x86_64 and MinGW i686 builds, DLL export and import checks
#   client   the test client (GCC build) on the whole corpus
#   wine     Windows 7-Zip 26.04 under Wine with the MinGW DLLs: 64-bit 7-Zip in
#            groups of compilers, 32-bit 7-Zip on a subset of the compilers
#   windows  MSVC x64 and Win32 builds, DLL checks, the MSVC test client and the
#            official 7-Zip 26.04 (x64 and x86) on the whole corpus
on:
  workflow_dispatch:
    inputs:
      fresh-corpus:
        description: Compile the whole corpus instead of starting from the cache
        type: boolean
        default: false
  push:
    paths:
      - InnoPlugin/**
      - .github/workflows/inno-plugin.yml
      - .github/scripts/setup-inno-tools.sh
  pull_request:
    paths:
      - InnoPlugin/**
      - .github/workflows/inno-plugin.yml
      - .github/scripts/setup-inno-tools.sh

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SEVENZIP_URL: https://github.com/ip7z/7zip/releases/download/26.04
  # SHA-256 of the 7-Zip 26.04 release assets 7z2604-x64.exe and 7z2604.exe.
  SEVENZIP_X64_SHA256: d54bf805f9f3704d1e8db2fa3498ae7ef2df0312b40b558e7c71c734430a665d
  SEVENZIP_X86_SHA256: 39bf65045153fc26c42fa9fe47afd8cd1b11671c7f11d031e738c9a13960c009

jobs:
  corpus:
    name: Corpus (Inno Setup under Wine)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # The runner compiles only the installers whose scripts or payload changed
      # (corpus_key in run_tests.py), so an older corpus is a good start.
      - name: Cache key of the corpus
        id: key
        run: >
          echo "key=corpus-${{ hashFiles('InnoPlugin/tests/corpus/**', 'InnoPlugin/tests/make_payload.py',
          'InnoPlugin/tests/run_tests.py', 'InnoPlugin/tests/iscrypt/**', '.github/scripts/setup-inno-tools.sh') }}"
          >> "$GITHUB_OUTPUT"

      - name: Restore the corpus cache
        id: cache
        if: ${{ !inputs.fresh-corpus }}
        uses: actions/cache/restore@v6
        with:
          path: InnoPlugin/build/corpus
          key: ${{ steps.key.outputs.key }}
          restore-keys: corpus-

      - name: Install packages (Wine, MinGW)
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash .github/scripts/setup-inno-tools.sh packages

      - name: Install Inno Setup compilers under Wine
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash .github/scripts/setup-inno-tools.sh iscc

      - name: Compile the missing or outdated installers
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # One Wine server and set of Wine services for all compiler runs (see
          # the wine job).
          wineserver -w
          wineserver -p
          wine cmd /c exit > /dev/null 2>&1
          python3 InnoPlugin/tests/run_tests.py --compile-only

      - name: Save the corpus cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: InnoPlugin/build/corpus
          key: ${{ steps.key.outputs.key }}

      - name: Upload the test corpus (payload and installers)
        uses: actions/upload-artifact@v7
        with:
          name: inno-corpus
          path: InnoPlugin/build/corpus
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  build:
    name: Build (GCC, MinGW)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install build tools (CMake, Ninja, MinGW)
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            cmake ninja-build g++ g++-mingw-w64

      - name: Build with GCC
        working-directory: InnoPlugin
        run: |
          cmake -S . -B build/linux -G Ninja
          cmake --build build/linux

      - name: Build with MinGW x86_64
        working-directory: InnoPlugin
        run: |
          cmake -S . -B build/mingw-x86_64 -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-x86_64.cmake
          cmake --build build/mingw-x86_64

      - name: Build with MinGW i686
        working-directory: InnoPlugin
        run: |
          cmake -S . -B build/mingw-i686 -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-i686.cmake
          cmake --build build/mingw-i686

      - name: Check DLL exports and imports (objdump)
        run: >
          python3 InnoPlugin/tests/check_dll.py
          InnoPlugin/build/mingw-x86_64/Inno.64.dll InnoPlugin/build/mingw-i686/Inno.32.dll

      - name: Upload the builds for the test jobs
        uses: actions/upload-artifact@v7
        with:
          name: inno-build-linux
          path: |
            InnoPlugin/build/linux/Inno.so
            InnoPlugin/build/linux/inno_client
            InnoPlugin/build/mingw-x86_64/Inno.64.dll
            InnoPlugin/build/mingw-i686/Inno.32.dll
          if-no-files-found: error
          retention-days: 1

      - name: Upload the MinGW DLLs
        uses: actions/upload-artifact@v7
        with:
          name: inno-plugin-mingw
          path: |
            InnoPlugin/build/mingw-x86_64/Inno.64.dll
            InnoPlugin/build/mingw-i686/Inno.32.dll
          if-no-files-found: error

  client:
    name: Test client (Linux, all compilers)
    needs: [corpus, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download the test corpus
        uses: actions/download-artifact@v8
        with:
          name: inno-corpus
          path: InnoPlugin/build/corpus

      - name: Download the builds
        uses: actions/download-artifact@v8
        with:
          name: inno-build-linux
          path: InnoPlugin/build

      - name: Tests (test client)
        run: |
          chmod +x InnoPlugin/build/linux/inno_client
          python3 InnoPlugin/tests/run_tests.py --no-compile --no-sevenzip

  wine:
    name: Wine ${{ matrix.arch }} 7-Zip (Inno Setup ${{ matrix.name }})
    needs: [corpus, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            name: 5.6.1 to 6.2.2
            compilers: 5.6.1,5.6.1-unicode,6.0.5,6.1.2,6.2.2
          - arch: x64
            name: 6.3.3 to 6.6.1
            compilers: 6.3.3,6.4.3,6.5.4,6.6.1
          - arch: x64
            name: 6.7.3 to 7.1.0
            compilers: 6.7.3,7.0.2-x64,7.1.0-x64,7.1.0-x86
          # 32-bit 7-Zip only with a compiler from each format group; the
          # windows job tests 32-bit 7-Zip on the whole corpus.
          - arch: x86
            name: 5.6.1, 6.2.2, 6.4.3, 7.1.0
            compilers: 5.6.1,6.2.2,6.4.3,7.1.0-x86
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Wine and 7-Zip
        run: |
          bash .github/scripts/setup-inno-tools.sh packages
          bash .github/scripts/setup-inno-tools.sh sevenzip

      - name: Download the test corpus
        uses: actions/download-artifact@v8
        with:
          name: inno-corpus
          path: InnoPlugin/build/corpus

      - name: Download the builds
        uses: actions/download-artifact@v8
        with:
          name: inno-build-linux
          path: InnoPlugin/build

      - name: Get the 32-bit 7-Zip 26.04
        if: matrix.arch == 'x86'
        run: |
          curl -fsSL -o InnoPlugin/build/7z2604.exe "$SEVENZIP_URL/7z2604.exe"
          echo "$SEVENZIP_X86_SHA256  InnoPlugin/build/7z2604.exe" | sha256sum -c -
          7zz x -y -oInnoPlugin/build/7zip-x86 InnoPlugin/build/7z2604.exe > /dev/null

      # One Wine server and one set of Wine services for all 7-Zip runs, instead
      # of starting and stopping them for every run (most of the time of a run).
      # The first program starts the services, which keep its output open: run
      # it with the output going to /dev/null, so that no test waits for it.
      - name: Start a persistent Wine server
        run: |
          wineserver -w
          wineserver -p
          7z-win i > /dev/null 2>&1

      - name: Tests (7-Zip under Wine)
        run: |
          if [ "${{ matrix.arch }}" = x64 ]; then
            dir=/opt/inno-tools/7zip-win64 dll=InnoPlugin/build/mingw-x86_64/Inno.64.dll
          else
            dir=InnoPlugin/build/7zip-x86 dll=InnoPlugin/build/mingw-i686/Inno.32.dll
          fi
          python3 InnoPlugin/tests/run_tests.py --no-compile --no-client \
            --compilers "${{ matrix.compilers }}" --sevenzip-dir "$dir" --sevenzip-plugin "$dll"

  windows:
    name: Windows (MSVC, official 7-Zip)
    needs: corpus
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download the test corpus
        uses: actions/download-artifact@v8
        with:
          name: inno-corpus
          path: InnoPlugin/build/corpus

      - name: Build with MSVC x64 Release
        working-directory: InnoPlugin
        run: |
          cmake -S . -B build/x64 -G "Visual Studio 17 2022" -A x64
          cmake --build build/x64 --config Release --parallel

      - name: Build with MSVC Win32 Release
        working-directory: InnoPlugin
        run: |
          cmake -S . -B build/Win32 -G "Visual Studio 17 2022" -A Win32
          cmake --build build/Win32 --config Release --parallel

      - name: Check DLL exports and imports (dumpbin; no VCRUNTIME, MSVCP or api-ms-win-crt)
        run: >
          python InnoPlugin/tests/check_dll.py --dumpbin auto
          InnoPlugin/build/x64/Release/Inno.64.dll InnoPlugin/build/Win32/Release/Inno.32.dll

      - name: Get the official 7-Zip 26.04 x64 and x86 (extracted, not installed)
        run: |
          get() {
            curl -fsSL -o "InnoPlugin/build/$1" "$SEVENZIP_URL/$1"
            echo "$2  InnoPlugin/build/$1" | sha256sum -c -
            7z x -y "-oInnoPlugin/build/$3" "InnoPlugin/build/$1" > /dev/null
            mkdir -p "InnoPlugin/build/$3/Formats"
            cp "$4" "InnoPlugin/build/$3/Formats/"
            ls "InnoPlugin/build/$3/Formats"
          }
          get 7z2604-x64.exe "$SEVENZIP_X64_SHA256" 7zip-x64 InnoPlugin/build/x64/Release/Inno.64.dll
          get 7z2604.exe "$SEVENZIP_X86_SHA256" 7zip-x86 InnoPlugin/build/Win32/Release/Inno.32.dll

      - name: Tests (MSVC x64 test client, 64-bit 7-Zip with Inno.64.dll)
        run: >
          python InnoPlugin/tests/run_tests.py --no-compile
          --client InnoPlugin/build/x64/Release/inno_client.exe
          --plugin InnoPlugin/build/x64/Release/Inno.64.dll
          --sevenzip-dir InnoPlugin/build/7zip-x64

      - name: Tests (MSVC Win32 test client, 32-bit 7-Zip with Inno.32.dll)
        run: >
          python InnoPlugin/tests/run_tests.py --no-compile
          --client InnoPlugin/build/Win32/Release/inno_client.exe
          --plugin InnoPlugin/build/Win32/Release/Inno.32.dll
          --sevenzip-dir InnoPlugin/build/7zip-x86

      - name: Upload the MSVC DLLs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: inno-plugin-msvc
          path: |
            InnoPlugin/build/x64/Release/Inno.64.dll
            InnoPlugin/build/Win32/Release/Inno.32.dll
          if-no-files-found: error